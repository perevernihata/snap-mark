name: Bug report
description: Report a reproducible problem in SnapMark.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Remove private information from screenshots and logs before attaching them.
  - type: input
    id: version
    attributes:
      label: SnapMark version
      description: Find this in the release name or the app bundle's Get Info panel.
      placeholder: 1.0.20
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.6, MacBook Pro M3
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: Display layout
      description: Include display count, resolutions, scaling, and which display contains the menu bar when relevant.
      placeholder: Two displays, Retina laptop below a 1920 x 1080 external display
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open SnapMark
        2. Choose Capture area
        3. Drag across the display boundary
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted screenshots or crash report excerpts if they help. Never attach an unredacted private capture.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed passwords, personal messages, tokens, and other private content from attachments.
          required: true
