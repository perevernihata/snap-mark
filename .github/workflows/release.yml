name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the protected main tip
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main
          test "${GITHUB_SHA}" = "$(git rev-parse origin/main)"
          test "${GITHUB_SHA}" = "$(git rev-list -n 1 "${GITHUB_REF_NAME}")"

      - name: Match tag to bundle version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Check repository
        run: make check

      - name: Build and test
        run: make test

      - name: Build universal package
        run: make package

      - name: Verify package
        run: make verify-package

      - name: Upload verified release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SnapMark-release-${{ github.sha }}
          path: |
            dist/SnapMark.zip
            dist/SnapMark.zip.sha256
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest release provenance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SnapMark-release-${{ github.sha }}
          path: dist

      - name: Recheck release payload without executing it
        run: |
          cd dist
          sha256sum --check SnapMark.zip.sha256
          unzip -tq SnapMark.zip

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SnapMark.zip.sha256
          create-storage-record: false

  publish:
    name: Approve and publish release
    needs:
      - build
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download attested release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SnapMark-release-${{ github.sha }}
          path: dist

      - name: Recheck release payload without executing it
        run: |
          cd dist
          sha256sum --check SnapMark.zip.sha256
          unzip -tq SnapMark.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/SnapMark.zip \
            dist/SnapMark.zip.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --latest \
            --generate-notes \
            --title "SnapMark ${GITHUB_REF_NAME#v}"
